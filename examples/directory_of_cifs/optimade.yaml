config_version: 0.2.0
database_description: Simple DB

entries:
  - entry_type: structures
    entry_paths:
      - path: cifs
        matches: ["*.cif"]
    # (optional) properties:
    property_paths:
      - path: properties.json
    property_definitions:
      - name: energy
        title: Total energy
        description: DFT total energy
        unit: eV/atom
        type: float
